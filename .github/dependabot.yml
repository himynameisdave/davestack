version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
      # Prisma CLI, client, and adapters should move together to stay compatible.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      # oxlint and its shared config should move together to stay compatible.
      oxlint:
        patterns:
          - 'oxlint'
          - '@himynameisdave/oxlint-config'
      # oxfmt and its shared config should move together to stay compatible.
      oxfmt:
        patterns:
          - 'oxfmt'
          - '@himynameisdave/oxfmt-config'
    ignore:
      # typescript stays on 6 until SvelteKit supports the TS 7 native compiler — see
      # "TypeScript — split toolchain" in CLAUDE.md. Remove this rule at flip time.
      # (TS 7 for `svelte-check` lives under the `@typescript/native` alias, which is free to bump.)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
