# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'bun' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    groups:
      # Better Auth core + plugins must move together to stay compatible.
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
      # Prisma CLI, client, and adapters should move together to stay compatible.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
    ignore:
      # typescript stays on 6 until SvelteKit supports the TS 7 native compiler — see
      # "TypeScript — split toolchain" in CLAUDE.md. Remove this rule at flip time.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
