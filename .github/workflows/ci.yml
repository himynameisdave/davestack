name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public placeholders keep build-time imports independent of real services.
env:
  BUN_VERSION: 1.4.4
  BETTER_AUTH_SECRET: ci-not-a-real-secret-safe-to-be-public
  BETTER_AUTH_URL: http://localhost:4173
  DATABASE_URL: postgresql://davestack:davestack@localhost:5432/davestack?schema=public

jobs:
  lint:
    runs-on: ubuntu-latest
    # Skip the auto-generated release commit (release.yml already validated it).
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, '🔖 Release') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Type-aware lint needs generated SvelteKit + Prisma types on disk.
      - run: bunx svelte-kit sync
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, '🔖 Release') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, '🔖 Release') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx svelte-kit sync
      - run: bunx prisma generate
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, '🔖 Release') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: davestack
          POSTGRES_PASSWORD: davestack
          POSTGRES_DB: davestack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # With CI set, scripts/test-e2e.ts uses this fresh service DB instead of starting one in Docker.
      NODE_ENV: test
      TEST_MODE: '1'
      DATABASE_URL: postgresql://davestack:davestack@localhost:5432/davestack_test?schema=public
      DIRECT_DATABASE_URL: postgresql://davestack:davestack@localhost:5432/davestack_test?schema=public
      # WebAuthn verifies credentials against the preview server's origin.
      BETTER_AUTH_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, '🔖 Release') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
